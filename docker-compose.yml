services:
  postgres:
    image: postgres:16-alpine
    container_name: onego-postgres
    environment:
      POSTGRES_USER: onego
      POSTGRES_PASSWORD: onego
      POSTGRES_DB: onego
    ports:
      - "5432:5432"
    volumes:
      - onego-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onego -d onego"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: onego-redis
    ports:
      - "6379:6379"
    volumes:
      - onego-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  onego-postgres-data:
  onego-redis-data:
